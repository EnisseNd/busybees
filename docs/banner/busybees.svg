<text x="580" y="111.5"><tspan fill="#ffd65a" xml:space="preserve">busybees</tspan><tspan fill="#8b7a55" xml:space="preserve">@</tspan><tspan fill="#6aa3e8" xml:space="preserve">yale</tspan></text>
<text x="580" y="128.5"><tspan fill="#8b7a55" xml:space="preserve">----------------------------------</tspan></text>
<text x="580" y="145.5"><tspan fill="#d99a2b" xml:space="preserve">Tagline       </tspan><tspan fill="#f6ecd2" xml:space="preserve">one meal a week with someone new</tspan></text>
<text x="580" y="162.5"><tspan fill="#d99a2b" xml:space="preserve">For           </tspan><tspan fill="#f6ecd2" xml:space="preserve">Yalies with no room in their calendar</tspan></text>
<text x="580" y="196.5"><tspan fill="#d99a2b" xml:space="preserve">Match.By      </tspan><tspan fill="#f6ecd2" xml:space="preserve">what's on your lunch tray</tspan></text>
<text x="580" y="213.5"><tspan fill="#d99a2b" xml:space="preserve">Match.When    </tspan><tspan fill="#f6ecd2" xml:space="preserve">a gap you both have, from Google Calendar</tspan></text>
<text x="580" y="230.5"><tspan fill="#d99a2b" xml:space="preserve">Match.Size    </tspan><tspan fill="#f6ecd2" xml:space="preserve">two people, 1 hour or less</tspan></text>
<text x="580" y="247.5"><tspan fill="#d99a2b" xml:space="preserve">Match.Every   </tspan><tspan fill="#f6ecd2" xml:space="preserve">week</tspan></text>
<text x="580" y="281.5"><tspan fill="#ffd65a" xml:space="preserve">What lands in your inbox</tspan></text>
<text x="580" y="298.5"><tspan fill="#f6ecd2" xml:space="preserve">"You've been matched with </tspan><tspan fill="#6aa3e8" xml:space="preserve">X</tspan><tspan fill="#f6ecd2" xml:space="preserve"> for</tspan></text>
<text x="580" y="315.5"><tspan fill="#f6ecd2" xml:space="preserve"> a meal at </tspan><tspan fill="#6aa3e8" xml:space="preserve">this time</tspan><tspan fill="#f6ecd2" xml:space="preserve">."</tspan></text>
